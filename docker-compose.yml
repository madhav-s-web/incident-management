services:
  mysql:
    image: mysql:8.4
    container_name: incident-mysql
    environment:
      MYSQL_DATABASE: incident_management
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
      MYSQL_USER: incident_app
      MYSQL_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in your environment}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: incident-management-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/incident_management
      DB_USERNAME: incident_app
      DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in your environment}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  mysql_data: